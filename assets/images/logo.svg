  <rect x="136" y="120" width="28" height="40" rx="6" fill="url(#blueGrad)" />
  <rect x="170" y="100" width="28" height="60" rx="6" fill="url(#blueGrad)" />

  <!-- Text "mkr." -->
  <text x="142" y="215" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#1d4ed8" text-anchor="end" letter-spacing="-2">mkr</text>
  <!-- Cyan dot -->
  <rect x="146" y="202" width="12" height="12" rx="3" fill="#38bdf8" />

