      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  
  <!-- Network Node Top Structure (Cyan) -->
  <rect x="105" y="45" width="28" height="28" rx="8" fill="url(#cyanGrad)" />
  <rect x="167" y="45" width="28" height="28" rx="8" fill="url(#cyanGrad)" />
  
  <!-- Connecting bridge -->
  <path d="M119 65 C 119 90, 140 95, 150 95 C 160 95, 181 90, 181 65 L 181 85 C 181 105, 160 115, 150 115 C 140 115, 119 105, 119 85 Z" fill="url(#cyanGrad)" />
  <rect x="136" y="80" width="28" height="35" rx="8" fill="url(#cyanGrad)" />

